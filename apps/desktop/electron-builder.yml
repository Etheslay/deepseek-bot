appId: com.deepseekbot.desktop
productName: DeepSeek Bot
directories:
  output: release
  buildResources: assets
files:
  - out/**/*
  - package.json
  - assets/**/*
# D11-13: third-party notices ship as a resource (outside asar, visible in
# <install>\resources\) so they travel with every installed copy.
extraResources:
  - from: ../../docs/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  # D12: the Host child process (Node >= 24 entry) ships outside the asar —
  # the desktop main spawns it via resources/host/main.js. `pack:win` must
  # build @deepseek-bot/host first (pnpm --filter @deepseek-bot/host build);
  # the Node >= 24 runtime itself is a D13 packaging item.
  - from: ../../packages/host/dist
    to: host
# D11 (FR-10): per-user NSIS installer. No admin rights, no HKLM, no system
# service. User data lives under %APPDATA%\DeepSeekBot (packages/storage
# layout.ts) and is kept on uninstall by default — documented in RELEASE notes.
win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  artifactName: "${productName}-${version}-${arch}.${ext}"
# D24: electron-updater metadata source. The publish config exists so
# electron-builder emits latest.yml next to the installer (RELEASE.md §4.1
# expects it inside the packaging CI artifact). It does NOT mean "publish by
# default": on a CI runner an explicit publish provider makes electron-builder
# schedule an upload, and there is no token-free fallback — the build fails on
# the missing GH_TOKEN (observed 2026-11-01). CI therefore passes
# `--publish never` explicitly (.github/workflows/package.yml, Build step);
# local builds without a CI environment already default to never. The first
# GitHub Release goes out with the finale task per RELEASE.md.
publish:
  provider: github
  owner: Etheslay
  repo: deepseek-bot
asar: true
