name: Package

# D11 (FR-10): product packaging CI. Builds the Windows x64 NSIS installer
# and publishes it as a workflow artifact together with its SHA-256 sums.
# CI proves the installer is reproducibly buildable from a fixed tree — it
# does NOT replace the clean-machine install trial (D11 brief §5) and never
# publishes a release: tags are built, not released.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record versions
        run: |
          node --version
          pnpm --version
          pnpm --filter @deepseek-bot/desktop exec electron-builder --version

      # --publish never is explicit here, not a default: electron-builder.yml
      # carries the D24 publish config (it makes latest.yml emit next to the
      # installer), and on a CI runner an explicit publish provider makes
      # electron-builder schedule an upload — without GH_TOKEN that fails the
      # whole build (observed 2026-11-01 on a develop workflow_dispatch run).
      # With --publish never the upload is skipped while latest.yml is still
      # written, so the artifact set below stays complete (RELEASE.md §4.1).
      - name: Build NSIS installer
        run: |
          pnpm --filter @deepseek-bot/desktop exec electron-vite build
          pnpm --filter @deepseek-bot/desktop exec electron-builder --win nsis --x64 --config electron-builder.yml --publish never

      - name: Generate SHA-256 sums
        shell: pwsh
        run: |
          $files = Get-ChildItem "apps/desktop/release" -File |
            Where-Object { $_.Name -like "*.exe" }
          if ($files.Count -eq 0) { throw "no installer produced" }
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $lines | Out-File -FilePath "apps/desktop/release/SHA256SUMS.txt" -Encoding ascii
          Get-Content "apps/desktop/release/SHA256SUMS.txt"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
