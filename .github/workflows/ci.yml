name: CI

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        shell: pwsh
        run: |
          $last = 1
          foreach ($attempt in 1..3) {
            pnpm install --frozen-lockfile
            $last = $LASTEXITCODE
            if ($last -eq 0) { exit 0 }
            Write-Host "pnpm install failed with exit $last (attempt $attempt of 3)"
            if ($attempt -lt 3) { Start-Sleep -Seconds (15 * $attempt) }
          }
          exit $last

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
